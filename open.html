<!DOCTYPE html>
<html lang="en">
<head>

    <title>Open Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f9f9f9; }
        h1 { color: #333; }
        .box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .note { color: #green; font-weight: bold; }

</head>
<body>
    <div class="box">

        <p><small>Created for the Google Search Console experiment.</small></p>
    </div>

</html>
